name: ci
on:
  push:
  pull_request:
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m infodesk.harness
      - uses: actions/upload-artifact@v4
        with:
          name: harness-json
          path: |
            public/harness.json
            public/case.json
